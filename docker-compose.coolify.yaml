# Compose file used by COOLIFY only. `docker-compose.yml` stays the local-dev
# parity file (it publishes 8000 to the host, which is fine on a laptop).
#
# Why a separate file, and why compose at all:
#
#   1. STABLE HOSTNAME. Coolify names Dockerfile-buildpack containers
#      `<uuid>-<timestamp>`, and the timestamp changes on EVERY deploy — so
#      anything pointing at it breaks on the next redeploy. Compose services are
#      named `<service>-<app-uuid>`, which is stable (the same reason
#      `supabase-db-<uuid>` is addressable). The API reaches this at
#      `http://web-crawler-<app-uuid>:8000`.
#   2. NO PUBLISHED PORT. `expose` instead of `ports`: the crawler must be
#      reachable only on the internal `coolify` network, never from the
#      internet. It has no auth of its own — the only door is /web on the API,
#      which enforces X-API-Key.
#
# Everything else (concurrency, tiers, chrome path) comes from Coolify env vars.
services:
  web-crawler:
    build: .
    expose:
      - "8000"
    # Headless Chrome uses shared memory for renderer IPC. Docker's default
    # /dev/shm is 64MB and Chrome crashes or hangs under concurrency without
    # this. Symptom if lost: L2 fails while L1 keeps working.
    shm_size: "1gb"
    # Hard memory cap. The limits set in Coolify's own "Resource Limits" UI do
    # NOT apply to a compose build pack — Coolify injects those only for the
    # Dockerfile/nixpacks packs and otherwise uses this file verbatim, so a
    # container recreated from here comes up unbounded unless the cap lives
    # HERE. That is not academic: this crawler ran unbounded to 5.3 GB on an
    # 11 GB box, drove the host deep into swap, and took the n8n task runner
    # down with it (Sep 2026). memswap_limit == mem_limit disables swap for
    # the container, so it is killed and restarted rather than allowed to
    # thrash the whole box. Per-job bounds (app/config.py) keep it well under
    # this ceiling; the ceiling is the backstop for when they don't.
    mem_limit: 4g
    memswap_limit: 4g
    mem_reservation: 3g
    restart: unless-stopped
    # Compose deployments need the healthcheck HERE — Coolify's app-level
    # health-check setting only applies to the Dockerfile build pack, so without
    # this the dashboard reports `running:unknown` forever and can't tell a
    # wedged container from a working one. Needs `curl`, which the Dockerfile
    # installs for exactly this reason.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Chromium + deps make the first boot slow; don't fail during it.
      start_period: 40s
